<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1128px;height:191px;overflow:hidden}
  body{background:#FAFAF7;font-family:Inter,"Segoe UI",sans-serif;position:relative}
  /* faint grid, fades out to the right */
  .grid{position:absolute;inset:0;
    background-image:radial-gradient(#3B3BD6 1px,transparent 1.2px);background-size:18px 18px;
    opacity:.13;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 25%,transparent 55%)}
  .bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#3B3BD6,#0F766E)}
  /* text kept right of the logo overlay (bottom-left) and inside mobile crop */
  .txt{position:absolute;left:300px;top:38px}
  h1{margin:0;font-weight:800;font-size:34px;letter-spacing:-.02em;color:#0B1020;line-height:1.1}
  h1 span{color:#3B3BD6}
  p{margin:12px 0 0;font-weight:500;font-size:16px;color:#3a4256}
  p.since{margin-top:8px;font-size:14px}
  p b{color:#0F766E;font-weight:600}
  .url{position:absolute;right:40px;bottom:30px;font-weight:600;font-size:15px;color:#3B3BD6;
    border:1.5px solid #3B3BD6;border-radius:999px;padding:6px 14px}
  /* agent-flow motif on right */
  svg{position:absolute;right:36px;top:34px}
</style></head>
<body>
<div class="grid"></div>
<div class="txt">
  <h1>AI that works <span>inside your business</span></h1>
  <p>Agentic AI &nbsp;·&nbsp; Custom Software &nbsp;·&nbsp; Modernisation &nbsp;·&nbsp; Consulting</p>
  <p class="since"><b>Building software since 2017</b> &nbsp;·&nbsp; Greater Noida, India</p>
</div>
<div class="url">friensys.com</div>
<svg width="190" height="60" viewBox="0 0 190 60" fill="none">
  <path d="M15 30H65M85 30H125M145 30H175" stroke="#3B3BD6" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="15" cy="30" r="9" fill="#3B3BD6"/>
  <rect x="65" y="18" width="20" height="24" rx="5" fill="#fff" stroke="#3B3BD6" stroke-width="2"/>
  <rect x="125" y="18" width="20" height="24" rx="5" fill="#fff" stroke="#0F766E" stroke-width="2"/>
  <circle cx="175" cy="30" r="9" fill="#0F766E"/>
  <path d="M171 30l3 3 5-6" stroke="#fff" stroke-width="2" fill="none"/>
</svg>
<div class="bar"></div>
</body></html>
